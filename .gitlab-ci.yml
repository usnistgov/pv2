stages:
  - build
  - docker
  - deploy

build:
  image: node:23
  stage: build
  before_script:
    - corepack enable pnpm
    - pnpm config set @lrd:registry=$CI_API_V4_URL/projects/$E3_SDK_PROJECT_ID/packages/npm/
    - pnpm config set //gitlab.nist.gov/gitlab/api/v4/projects/$E3_SDK_PROJECT_ID/packages/npm/:_authToken="$E3_SDK_PROJECT_TOKEN"
    - pnpm config list
  script:
    - cd frontend
    - pnpm install
    - pnpm run build
  cache:
    - key:
        files:
          - frontend/pnpm-lock.yaml
      paths:
        - frontend/node_modules
  artifacts:
    paths:
      - frontend/dist/*

docker-db-build:
  image: docker:latest
  services:
    - docker:dind
  stage: docker
  tags: [dind]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "backend/database/**/*"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend/database
    - docker build -t $CI_REGISTRY_IMAGE:db .
    - docker push $CI_REGISTRY_IMAGE:db

docker-build:
  image: docker:latest
  services:
    - docker:dind
  stage: docker
  tags: [dind]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest -f gitlab-dockerfile .
    - docker push $CI_REGISTRY_IMAGE:latest
  needs:
    - job: "build"
      artifacts: true


include:
  - component: $CI_SERVER_FQDN/ELDST/ci-components/portainer-deploy@1.2.1
    inputs:
      url: haproxy-p.el.nist.gov:9000
      name: pv2