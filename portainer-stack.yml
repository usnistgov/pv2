services:
  server:
    image: docker.nist.gov:4567/eldst/pv2/server:latest
    environment:
      POSTGRES_HOSTNAME: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: OZr*ca^(H=r"*^;#SktbGSwX79K|ep)[g{ao4jHh
      POSTGRES_DB: PV2
    networks:
      - default
      - traefik_net
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_net"
        - "traefik.http.routers.pv2_router_http.rule=Host(`pv2test.el.nist.gov`)"
        - "traefik.http.routers.pv2_router_http.entrypoints=web"
        - "traefik.http.middlewares.https_redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.pv2_router_http.middlewares=https_redirect"
        - "traefik.http.routers.pv2_router_https.rule=Host(`pv2test.el.nist.gov`)"
        - "traefik.http.routers.pv2_router_https.entrypoints=websecure"
        - "traefik.http.routers.pv2_router_https.tls"
        - "traefik.http.services.pv2_service.loadbalancer.server.port=8080"

  postgres:
    image: docker.nist.gov:4567/eldst/pv2/db:latest
    hostname: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: OZr*ca^(H=r"*^;#SktbGSwX79K|ep)[g{ao4jHh
      POSTGRES_DB: PV2
    networks:
      - default

networks:
  postgres:
  traefik_net:
    external: true
